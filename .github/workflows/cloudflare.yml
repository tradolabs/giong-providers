name: Publish Cloudflare Wasm

on:
  push:
    branches: [main]

concurrency:
  group: cloudflare-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-wasip2

      - name: Build Cloudflare resources
        run: |
          cargo +stable build --locked --release --target wasm32-wasip2 \
            -p giong-cloudflare --bins --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and (.target.kind | index("bin"))) | .executable // empty' \
            > wasm-artifacts.txt
          test -s wasm-artifacts.txt

      - name: Set up ORAS
        uses: oras-project/setup-oras@v2
        with:
          version: 1.3.1

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Publish Cloudflare package
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          version="$(cargo +stable metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "giong-cloudflare") | .version')"
          owner="$(printf '%s' "$REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')"
          mkdir -p wasm-package
          layers=()
          while IFS= read -r artifact; do
            binary="$(basename "$artifact" .wasm)"
            resource="${binary#giong-cloudflare-}"
            cp "$artifact" "wasm-package/$resource.wasm"
            layers+=("$resource.wasm:application/wasm")
          done < wasm-artifacts.txt
          cd wasm-package
          oras push "ghcr.io/$owner/giong-providers/cloudflare:$version" \
            --artifact-type application/vnd.giong.provider.v1 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "${layers[@]}"
