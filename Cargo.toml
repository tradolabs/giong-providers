[workspace]
members = ["packages/api-client", "providers/*/wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
giong-api-client = { path = "packages/api-client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
wit-bindgen = "0.63"

[profile.release]
lto = "thin"
